server:
  port: ${PORT:8080}

spring:
  application:
    name: order-service
  datasource:
    url: ${ORDERS_DB_URL}
    username: ${ORDERS_DB_USERNAME:}
    password: ${ORDERS_DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
    open-in-view: false

services:
  payment:
    url: ${PAYMENT_SERVICE_URL:http://payment-service.ecommerce.svc.cluster.local}
  cart:
    url: ${CART_SERVICE_URL:http://cart-service.ecommerce.svc.cluster.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /
      path-mapping:
        health: health
  endpoint:
    health:
      probes:
        enabled: true
