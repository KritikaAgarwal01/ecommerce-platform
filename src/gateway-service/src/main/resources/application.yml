server:
  port: ${PORT:3000}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: cart-service
          uri: ${CART_SERVICE_URL:http://localhost:3001}
          predicates:
            - Path=/api/cart/**
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:3002}
          predicates:
            - Path=/api/payments/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:3003}
          predicates:
            - Path=/api/orders/**
        - id: reporting-service
          uri: ${REPORTING_SERVICE_URL:http://localhost:3004}
          predicates:
            - Path=/api/reports/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /
      path-mapping:
        health: health
  endpoint:
    health:
      probes:
        enabled: true
