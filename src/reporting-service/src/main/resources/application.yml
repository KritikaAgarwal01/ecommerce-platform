server:
  port: ${PORT:3000}

spring:
  application:
    name: reporting-service
  datasource:
    url: ${SQL_CONNECTION_STRING}
    username: ${SQL_USERNAME:}
    password: ${SQL_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

azure:
  cosmos:
    endpoint: ${COSMOS_DB_ENDPOINT}
    database: ${COSMOS_DB_DATABASE:ecommerce}
    container: ${COSMOS_DB_CONTAINER:reports}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /
      path-mapping:
        health: health
  endpoint:
    health:
      probes:
        enabled: true
