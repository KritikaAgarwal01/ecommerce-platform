  - type: textbox
    left: 0.8
    top: 1.8
    width: 11.0
    height: 1.2
    text: "AI-Driven Resiliency Research"
    font: "Segoe UI"
    font_size: 40
    font_color: "#F8F8FC"
    font_bold: true
    alignment: left

  # Subtitle
  - type: textbox
    left: 0.8
    top: 3.15
    width: 10.5
    height: 0.65
    text: "From Code to Confidence: End-to-End Automation for Architects"
    font: "Segoe UI"
    font_size: 20
    font_color: "#9CA3AF"
    alignment: left

  # Rich text tagline
  - type: rich_text
    left: 0.8
    top: 3.95
    width: 11.0
    height: 0.45
    segments:
      - text: "GitHub Copilot Skills"
        font: "Segoe UI"
        size: 14
        color: "#9CA3AF"
      - text: "  |  "
        font: "Segoe UI"
        size: 14
        color: "#0078D4"
      - text: "HVE Resiliency Research"
        font: "Segoe UI"
        size: 14
        color: "#9CA3AF"
      - text: "  |  "
        font: "Segoe UI"
        size: 14
        color: "#0078D4"
      - text: "ecommerce-platform"
        font: "Segoe UI"
        size: 14
        color: "#9CA3AF"

