  - type: shape
    shape: rectangle
    left: 0.8
    top: 2.95
    width: 6.0
    height: 0.04
    fill: "#0078D4"

  # Bottom-left badge — ARCHITECTS AUDIENCE
  - type: shape
    shape: rounded_rectangle
    left: 0.8
    top: 6.65
    width: 2.2
    height: 0.42
    fill: "#0078D4"
    corner_radius: 0.06
    text: "ARCHITECTS AUDIENCE"
    text_font: "Segoe UI"
    text_size: 11
    text_color: "#F8F8FC"
    text_bold: true

speaker_notes: |
  Welcome. This session walks through how we automated the entire resiliency review process for a five-service e-commerce platform using GitHub Copilot Skills and structured prompt engineering. By the end, you will understand both what the skill does and why it matters for scaling this practice across every repository.
