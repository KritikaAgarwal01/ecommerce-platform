slide: 6
title: "Evidence-Only Research: The Key Design Decision"
section: "Methodology"
layout: "content"

background:
  fill: "#0F1117"

elements:
  # Top accent bar
  - type: shape
    shape: rectangle
    left: 0
    top: 0
    width: 13.333
    height: 0.08
    fill: "#0078D4"

  # Slide title
  - type: textbox
    left: 0.5
    top: 0.15
    width: 12.333
    height: 0.55
    text: "Evidence-Only Research: The Key Design Decision"
    font: "Segoe UI"
    font_size: 28
    font_color: "#F8F8FC"
    font_bold: true
    alignment: left

  # Left card — RESEARCH PHASES 1-3 RULES (red accent = rules/constraints)
  - type: card
    left: 0.5
    top: 0.88
    width: 6.0
    height: 6.2
    title: "RESEARCH PHASES 1–3 RULES"
    title_color: "#F8F8FC"
    title_size: 13
    title_bold: true
    accent_bar: true
    accent_color: "#EF4444"
    content:
      - bullet: "No recommendations allowed"
        color: "#F8F8FC"
      - bullet: "No code examples"
        color: "#9CA3AF"
      - bullet: "Every finding requires: file path + line number"
        color: "#F8F8FC"
      - bullet: "Priority classification: P0 / P1 / P2 / P3"
        color: "#9CA3AF"
      - bullet: "Existing mitigations captured with evidence"
        color: "#9CA3AF"
      - bullet: "Service Exclusion Rule: only confirmed dependencies analyzed"
        color: "#F8F8FC"

  # Right card — WHY THIS MATTERS (green accent = positive outcomes)
  - type: card
    left: 6.833
    top: 0.88
    width: 6.0
    height: 6.2
    title: "WHY THIS MATTERS"
    title_color: "#F8F8FC"
    title_size: 13
    title_bold: true
    accent_bar: true
    accent_color: "#10B981"
    content:
      - bullet: "Eliminates hallucinated findings not backed by code"
        color: "#F8F8FC"
      - bullet: "Separates what IS from what SHOULD BE"
        color: "#9CA3AF"
      - bullet: "Planning phase cannot contradict research evidence"
        color: "#F8F8FC"
      - bullet: "Findings survive code reviews and architecture boards"
        color: "#9CA3AF"
      - bullet: "Teams trust the output because every claim is traceable"
        color: "#F8F8FC"

speaker_notes: |
  The most important design decision was separating evidence collection from planning. The research phases are forensic — the AI is not allowed to recommend fixes. This means the planning phase works from a grounded evidence base, not from speculative analysis. Every finding that makes it into the final reports has a file path and line number behind it.
