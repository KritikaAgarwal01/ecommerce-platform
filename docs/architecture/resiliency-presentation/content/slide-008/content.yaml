        color: "#F8F8FC"
      - bullet: "One failed pod = cascading failure"
        color: "#EF4444"
      - bullet: "HTTP clients configured with no resilience handlers — any transient fault propagates through the call chain"
        color: "#9CA3AF"

speaker_notes: |
  The skill surfaced 22 findings in a single run. Seven of them are P0 — they block the active/active transition entirely. The most striking finding: the IaC has no secondary region defined at all. There is literally nothing to fail over to. This would have been catastrophic to discover during a live failover drill.
